<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Laporan - LaporBantu</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; gap: 15px; }
        .back-btn { background-color: #f1f3f4; color: #333; padding: 8px 15px; width: auto; margin: 0; }
        
        .report-list { display: flex; flex-direction: column; gap: 15px; }
        
        .report-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; gap: 15px; }
        .report-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background-color: #eee; }
        .report-info { flex: 1; }
        .report-info h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .report-info p { margin: 0 0 5px 0; font-size: 13px; color: #666; }
        
        /* Pewarnaan Status */
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .status-menunggu { background-color: #fef08a; color: #854d0e; }
        .status-diproses { background-color: #bfdbfe; color: #1e40af; }
        .status-selesai { background-color: #bbf7d0; color: #166534; }
        .status-ditolak { background-color: #fecaca; color: #991b1b; }
        
        .loading-text { text-align: center; color: #666; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body style="display: block; height: auto; padding-top: 20px;">

    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Kembali</button>
            <h2>Laporan Saya</h2>
        </div>

        <div id="reportContainer" class="report-list">
            <div class="loading-text" id="loadingIndicator">Mengambil data dari server...</div>
            <!-- Kartu laporan akan dimasukkan ke sini oleh JavaScript -->
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/riwayat.js"></script>
</body>
</html>
