<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa - LaporBantu</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Tambahan style khusus dashboard agar rapi */
        .dashboard-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .welcome-card { background: linear-gradient(135deg, #1a73e8, #4285f4); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-card h3 { color: #1a73e8; font-size: 24px; margin-top: 5px; }
        .btn-danger { background-color: #d93025; padding: 8px 15px; font-size: 14px; width: auto; margin: 0; }
        .btn-danger:hover { background-color: #b3261e; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    </style>
</head>
<body style="display: block; height: auto; padding-top: 20px;">

    <div class="dashboard-container">
        <div class="header">
            <h2>LaporBantu</h2>
            <button id="btnLogout" class="btn-danger">Logout</button>
        </div>

        <div class="welcome-card">
            <h3 id="userName">Halo, Siswa!</h3>
            <p id="userClass">Kelas: -</p>
            <p style="margin-top: 10px; font-weight: bold;">Poin Anda: <span id="userPoints">0</span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <p>Total Laporan Saya</p>
                <h3 id="statTotal">...</h3> <!-- Tambahkan ID di sini -->
            </div>
            <div class="stat-card">
                <p>Laporan Selesai</p>
                <h3 id="statSelesai">...</h3> <!-- Tambahkan ID di sini -->
            </div>
        </div>

        <div class="menu-grid">
            <button onclick="window.location.href='buat-laporan.html'">+ Buat Laporan Baru</button>
            <button style="background-color: white; color: #1a73e8; border: 1px solid #1a73e8;" onclick="window.location.href='riwayat-laporan.html'">Cek Status Laporan</button> </button>
        </div>
    </div>

<!-- Panggil file JavaScript -->
    <script src="js/api.js"></script>  <!-- INI YANG BARU KITA TAMBAHKAN -->
    <script src="js/student.js"></script>
</body>
</html>
